name: Build Android APK

on: [push]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project & Configure Gradle/Kotlin
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --project-name=apk_chat --platforms=android .
          cp pubspec.yaml.bak pubspec.yaml
          
          # تعديل نسخ Android SDK
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
          
          # تحديث نسخة Kotlin في android/build.gradle لتتوافق مع المكتبات الحديثة
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.8.20"/' android/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
